name: Build & Publish Kiosk OTA Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK for Release
        run: |
          VERSION_TAG="${{ github.ref_name || github.event.inputs.version }}"
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk release-artifacts/PoultryAttend-${VERSION_TAG}.apk || cp android/app/build/outputs/apk/release/*.apk release-artifacts/PoultryAttend-${VERSION_TAG}.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          name: "Release ${{ github.ref_name || github.event.inputs.version }}"
          body: |
            ## 🐔 PoultryAttend Kiosk OTA Release (${{ github.ref_name || github.event.inputs.version }})

            ### 🚀 Over-The-Air (OTA) Installation:
            1. Open the **PoultryAttend** app on your kiosk terminal.
            2. Tap **Settings** → **Updates (OTA)**.
            3. Tap **Check for Updates**.
            4. The app will automatically download and install this update directly over Wi-Fi / 4G!

            ### 📦 Direct Download:
            Download the attached `.apk` file below.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
